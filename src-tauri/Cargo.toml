[package]
name = "prizma"
version = "0.1.0"
description = "Prizma - lighting and key studio for the Redragon K617 Fizz"
authors = ["Mert Demirdöven"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "prizma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
parking_lot = "0.12"
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
