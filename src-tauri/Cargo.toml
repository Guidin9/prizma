[package]
name = "prizma"
version = "1.0.1"
description = "Prizma - open-source RGB lighting studio for the Redragon K617 Fizz keyboard"
authors = ["Mert Demirdöven"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Guidin9/prizma"
homepage = "https://github.com/Guidin9/prizma"
edition = "2021"

[lib]
name = "prizma_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_Globalization",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
